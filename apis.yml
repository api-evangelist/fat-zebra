name: Fat Zebra
kind: company
description: Fat Zebra is an Australian payments company (founded 2012, Sydney) providing a card-present
  and card-not-present payment gateway and processing platform for merchants, ISOs, and software platforms
  across Australia and New Zealand. Its API-first Gateway handles Visa, Mastercard, and Amex purchases,
  authorizations and captures, refunds and voids, card tokenization, 3D Secure, recurring payment plans,
  direct debits and direct credits over local bank rails, chargeback handling, batch processing, and hosted
  payment pages (PayNow), alongside wallet acceptance for Apple Pay, Google Pay, and Click to Pay. A separate
  Partner API lets platforms and ISOs create and board their own sub-merchants onto acquirer connections
  programmatically. The developer surface is a genuine, well-documented ReadMe hub at docs.fatzebra.com
  with four downloadable OpenAPI definitions, and the runtime platform is branded pmnts (gateway.pmnts.io).
  Authentication is HTTP Basic using a username and API token.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
