apis:
- aid: fat-zebra:fat-zebra-gateway-api
  name: Fat Zebra Gateway API
  description: The core Fat Zebra payments Gateway — 98 documented operations across
    73 paths covering purchases, authorizations and captures, refunds and voids, card
    tokenization (credit_cards), customers and bank accounts, direct debits and direct
    credits, chargebacks, batches, recurring payment plans, surcharging, and webhook
    management. OpenAPI 3.1. Auth is HTTP Basic (username + API token).
  humanURL: https://docs.fatzebra.com/reference/purchases
  baseURL: https://gateway.pmnts.io/v1.0
  tags:
  - Payments
  - Gateway
  - Card Payments
  - Tokenization
  properties:
  - type: OpenAPI
    url: openapi/fat-zebra-gateway.json
  - type: Documentation
    url: https://docs.fatzebra.com/docs/purchases-overview
  - type: APIReference
    url: https://docs.fatzebra.com/reference/purchases
- aid: fat-zebra:fat-zebra-partner-api
  name: Fat Zebra Partner API
  description: The Partner (v2) API for ISOs and software platforms to programmatically
    create and manage their own sub-merchants and acquirer connections — 30 operations
    across 22 paths covering partner self/identity, merchant create/board/lifecycle
    (activate, suspend, cancel), credential rotation, acquirer connection management,
    SSO enforcement, and dashboard users. OpenAPI 3.1. Auth is HTTP Basic (partner
    username + API token). Production, sandbox, and staging environments documented.
  humanURL: https://docs.fatzebra.com/docs/introduction
  baseURL: https://gateway.pmnts.io/v2/partners
  tags:
  - Merchant Onboarding
  - Partner
  - Acquiring
  properties:
  - type: OpenAPI
    url: openapi/fat-zebra-partner.json
  - type: Documentation
    url: https://docs.fatzebra.com/docs/introduction
  - type: APIReference
    url: https://docs.fatzebra.com/reference/showself
- aid: fat-zebra:fat-zebra-billing-api
  name: Fat Zebra Billing API
  description: An early usage-based Billing API (OpenAPI 3.0.3) exposing billing entities
    and a batch usage-record push for metered billing against customers. Documented
    server is the sandbox host billing.pmnts-sandbox.io. Auth is HTTP Basic.
  humanURL: https://docs.fatzebra.com/
  baseURL: https://billing.pmnts-sandbox.io/api/v1/
  tags:
  - Billing
  - Usage Based Billing
  properties:
  - type: OpenAPI
    url: openapi/fat-zebra-billing.json
  - type: Documentation
    url: https://docs.fatzebra.com/
- aid: fat-zebra:fat-zebra-fdms-tpp-merchant-onboarding-api
  name: Fat Zebra FDMS TPP Merchant Onboarding API
  description: A Third-Party Processor (TPP) merchant onboarding API for the FDMS acquiring
    integration (OpenAPI 3.0.3) — create and list merchants and an internal onboard
