                    default: 0
            text/plain:
              examples:
                Result:
                  value: "[#<FatZebra::Refund:0x3fe2b0133e7c id=071-R-S6KCRS76> JSON: {\n  \"authorization\": \"1529728340\",\n  \"id\": \"071-R-S6KCRS76\",\n  \"amount\": 100,\n  \"refunded\": \"Approved\",\n  \"message\": \"Approved\",\n  \"card_holder\": \"Card Holder\",\n  \"card_number\": \"411111XXXXXX1111\",\n  \"card_expiry\": \"2022-12-31\",\n  \"card_type\": \"VISA\",\n  \"transaction_id\": \"071-R-S6KCRS76\",\n  \"reference\": \"gw9rvxvv\",\n  \"currency\": \"AUD\",\n  \"successful\": true,\n  \"transaction_date\": \"2018-06-23T14:32:20+10:00\",\n  \"response_code\": \"00\",\n  \"settlement_date\": \"2018-06-24\",\n  \"metadata\": {\n  },\n  \"standalone\": true,\n  \"rrn\": \"071RS6KCRS76\"\n}]"
