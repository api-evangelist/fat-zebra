                        message:
                          type: string
                          example: Approved
                        card_holder:
                          type: string
                          example: Card Holder
                        card_number:
                          type: string
                          example: 411111XXXXXX1111
                        card_expiry:
                          type: string
                          example: '2022-12-31'
                        card_type:
                          type: string
                          example: VISA
                        transaction_id:
                          type: string
                          example: 071-R-ZXZV2IQA
                        reference:
                          type: string
                          example: 18jfjh280
                        currency:
