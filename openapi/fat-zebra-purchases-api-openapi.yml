                          example: 071PP7OX5AF6
                        cvv_match:
                          type: string
                          example: M
                        metadata:
                          type: object
                          properties: {}
                        addendum_data:
                          type: object
                          properties: {}
                  errors:
                    type: array
                  records:
                    type: integer
                    example: 2
                    default: 0
                  total_records:
