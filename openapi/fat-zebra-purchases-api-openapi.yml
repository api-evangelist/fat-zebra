      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl https://gateway.pmnts-sandbox.io/v1.0/purchases -u TEST:TEST
        - language: ruby
          code: FatZebra::DirectCredit.search
        samples-languages:
        - curl
        - ruby
      tags:
      - Purchases
  /purchases/:
    post:
      summary: Create a purchase using a wallet
      description: ''
      operationId: create-a-purchase-with-wallet
      parameters:
      - name: Content-Type
        in: header
        description: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - reference
              - customer_ip
              - currency
              - card_holder
              properties:
                amount:
                  type: integer
                  description: A positive integer representing how much to charge, in the smallest currency unit (eg., 100 to charge $1.00, or 100 to Charge ¥100, a zero decimal currency)
                  format: int32
                reference:
                  type: string
                  description: Reference of the transaction. Max length 255 characters.
                customer_ip:
                  type: string
                  description: RFC791-compliant IP address
                currency:
                  type: string
                  description: Three letter [ISO currency code](https://pmnts.readme.io/v1.0/docs/iso-currency-codes-1), in UPPERCASE
                  default: AUD
                card_holder:
                  type: string
                  description: Name of the card holder
                cvv:
                  type: string
                  description: CVV card number. (3/4 characters)
                test:
                  type: boolean
                  description: Indicates if this is a test transaction
                  default: false
                wallet:
                  type: object
                  description: Wallet credentials. Described below
                  required:
                  - type
                  properties:
                    type:
                      type: string
                      description: Name of the wallet ('ApplePay', 'GooglePay')
                    encPaymentData:
                      type: string
                      description: 'required for type: VISA'
                    encKey:
                      type: string
                      description: 'required for type: VISA'
                    callid:
                      type: string
                      description: 'required for type: VISA'
                    token:
                      type: string
                      description: 'required for type: APPLE, GOOGLE'
                    user_id:
                      type: string
                      description: 'required for type: MASTERPASSEXPRESS'
                    origin_url:
                      type: string
                      description: 'required for type: MASTERPASSEXPRESS'
                    card_id:
                      type: string
                      description: 'required for type: MASTERPASSEXPRESS'
                    address_id:
                      type: string
                      description: 'required for type: MASTERPASSEXPRESS'
                    checkout_resource_url:
                      type: string
                      description: 'required for type: MASTERPASS'
                    oauth_token:
                      type: string
                      description: 'required for type: MASTERPASS'
                    oauth_verifier:
                      type: string
                      description: 'required for type: MASTERPASS'
                    checkout_id:
                      type: string
                      description: 'required for type: ZIP_MONEY'
                    account_id:
                      type: string
                      description: 'required for type: ZIP_MONEY'
                metadata:
                  type: object
                  properties: {}
                addendum_data:
                  type: string
                extra:
                  properties:
                    ecm:
                      type: string
                      description: Specifies the transaction source and type for processing. This value is two digits, the first indicating the source (1 = Mail Order, 2 = Telephone Order, 3 = Internet) and the second indicating the payment type (1 = Single, 2 = Recurring, 3 = Instalment - not commonly supported)
                      default: '31'
                    sli:
                      type: string
                      description: The Security Level Indicator for 3DS transactions (from the MPI)
                    xid:
                      type: string
                      description: The transaction ID (XID) value of a 3D Secure authenticated transaction (from the MPI)
                    cavv:
                      type: string
                      description: The card holder authentication verification value for a 3D Secure authenticated transaction (from the MPI)
                    par:
                      type: string
                      description: The Payer Request result for a 3D Secure transaction (from the MPI)
                    ver:
                      type: string
                      description: The Verification Request result for a 3D Secure transaction (from the MPI)
                    threeds_version:
                      type: string
                      description: 'This presents the 3D Secure version used for this transaction. Examples are: ''1.0.0'', ''2.0.0'' etc. (from the MPI)'
                    directory_server_txn_id:
                      type: string
                      description: This is the unique identifier for a 3D Secure version 2 transaction. (from the MPI)
                    card_on_file:
                      type: boolean
